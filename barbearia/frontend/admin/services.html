<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0a0e12"><title>Serviços — Gama Estúdio</title><link rel="stylesheet" href="../css/style.css"></head>
<body data-admin-page="services">
  <div class="admin-layout">
    <aside class="sidebar" id="sidebar"><a class="sidebar-brand" href="index.html"><img src="../assets/logo.svg" alt=""><span><strong>GAMA ESTÚDIO</strong><small>PAINEL DO ESTÚDIO</small></span></a><p class="sidebar-label">Visão geral</p><nav class="sidebar-nav" aria-label="Administração"><a class="sidebar-link" href="index.html"><span class="sidebar-icon">⌂</span>Painel</a><a class="sidebar-link" href="appointments.html"><span class="sidebar-icon">◷</span>Agenda</a><a class="sidebar-link active" href="services.html"><span class="sidebar-icon">✂</span>Serviços</a><a class="sidebar-link" href="schedule.html"><span class="sidebar-icon">▦</span>Expediente</a><a class="sidebar-link" href="clients.html"><span class="sidebar-icon">♙</span>Clientes</a></nav><div class="sidebar-bottom"><a class="sidebar-link" href="../index.html"><span class="sidebar-icon">↗</span>Ver página pública</a><button id="btn-logout" class="sidebar-link btn-ghost" type="button"><span class="sidebar-icon">⇥</span>Sair</button></div></aside>
    <main class="admin-main"><div class="admin-content"><header class="admin-topbar"><div style="display:flex;gap:12px;align-items:center"><button id="menu-toggle" class="mobile-menu-toggle" type="button" aria-label="Abrir menu">☰</button><div><h1>Serviços</h1><p>Edite o cardápio que seus clientes veem.</p></div></div><button id="new-service-btn" class="btn btn-primary btn-sm" type="button">+ Novo serviço</button></header>
      <section class="panel"><header class="panel-head"><h2>Cardápio do estúdio</h2><span class="muted small">Valores em reais</span></header><div id="services-list"><div class="loading-spinner"><span class="spinner"></span></div></div></section>
    </div></main>
  </div>
  <div id="service-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-card"><header class="modal-head"><h2 id="modal-title">Novo serviço</h2><button class="icon-button" type="button" data-close-modal aria-label="Fechar">×</button></header>
    <form id="service-form"><div class="modal-body"><input id="service-id" type="hidden"><div class="form-field"><label for="service-name">Nome do serviço</label><input id="service-name" class="form-input" required minlength="2" maxlength="100" placeholder="Ex.: Corte"></div><div class="form-grid"><div class="form-field"><label for="service-price">Valor (R$)</label><input id="service-price" class="form-input" type="number" min="0" step="0.01" required></div><div class="form-field"><label for="service-duration">Duração (minutos)</label><input id="service-duration" class="form-input" type="number" min="5" step="5" required></div></div><label class="schedule-toggle"><input id="service-active" type="checkbox" checked> Serviço disponível para agendamento</label></div><div class="modal-footer"><button class="btn btn-outline" type="button" data-close-modal>Cancelar</button><button class="btn btn-primary" type="submit">Salvar serviço</button></div></form>
  </div></div>
  <div id="toast-container" aria-live="polite"></div>
  <script src="../js/api.js"></script><script src="../js/admin/auth.js"></script><script src="../js/admin/services.js"></script>
</body>
</html>
